<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="32" height="32">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#120c24"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3d4d"/>
      <stop offset="50%" stop-color="#1e2029"/>
      <stop offset="100%" stop-color="#111217"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#737993"/>
      <stop offset="100%" stop-color="#2c2f3b"/>
    </linearGradient>
    <linearGradient id="crystal-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg-glow)"/>

  <g transform="translate(0, 8)">
    <path d="M 96 160 L 176 160 L 256 380 L 336 160 L 416 160 L 256 440 Z" fill="url(#metal-dark)"/>
    <path d="M 116 160 L 176 160 L 256 380 L 176 380 Z" fill="url(#metal-light)" opacity="0.3"/>
    <path d="M 396 160 L 336 160 L 256 380 L 336 380 Z" fill="url(#metal-light)" opacity="0.15"/>

    <path d="M 150 200 L 210 200 L 362 340 L 302 340 Z" fill="url(#metal-light)" opacity="0.8"/>
    <path d="M 362 200 L 302 200 L 150 340 L 210 340 Z" fill="url(#metal-dark)"/>

    <polygon points="216,210 226,200 286,200 296,210 256,250" fill="url(#cyan-glow)" opacity="0.9"/>
    <polygon points="210,290 256,336 302,290 280,290 256,314 232,290" fill="url(#cyan-glow)" opacity="0.7"/>

    <g filter="url(#core-glow)">
      <polygon points="256,170 320,207 320,281 256,318 192,281 192,207" fill="url(#metal-dark)" stroke="url(#metal-light)" stroke-width="4"/>
      <polygon points="256,182 308,212 308,272 256,302 204,272 204,212" fill="url(#crystal-core)"/>
      <polygon points="256,182 308,212 256,242 204,212" fill="#ffffff" opacity="0.25"/>
      <polygon points="204,212 256,242 256,302 204,272" fill="#000000" opacity="0.3"/>

      <polygon points="256,215 285,232 285,265 256,282 227,265 227,232" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.8"/>
      <line x1="256" y1="248" x2="256" y2="282" stroke="#22d3ee" stroke-width="2" opacity="0.8"/>
      <line x1="256" y1="248" x2="227" y2="232" stroke="#22d3ee" stroke-width="2" opacity="0.8"/>
      <line x1="256" y1="248" x2="285" y2="232" stroke="#22d3ee" stroke-width="2" opacity="0.8"/>

      <path d="M 280 270 L 325 315 L 305 325 L 265 285 Z" fill="url(#cyan-glow)"/>
    </g>
